<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>India vs West Indies Live | Cricket News & Blog</title>

  <meta name="description"
        content="India vs West Indies live cricket score, latest news, match updates, previews and cricket blogs.">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f1f5f9;
      color: #172033;
      line-height: 1.6;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      background: linear-gradient(135deg, #075985, #1d4ed8);
      color: white;
    }

    .top-header {
      max-width: 1200px;
      margin: auto;
      padding: 25px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 25px;
      font-weight: 800;
    }

    .logo span {
      color: #facc15;
    }

    nav {
      display: flex;
      gap: 25px;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
    }

    nav a:hover {
      color: #facc15;
    }

    /* =========================
       HERO
    ========================= */

    .hero {
      text-align: center;
      padding: 55px 20px;
    }

    .hero h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .hero p {
      font-size: 17px;
      opacity: .9;
    }

    /* =========================
       MAIN
    ========================= */

    .container {
      max-width: 1100px;
      margin: 35px auto;
      padding: 0 20px;
    }

    /* =========================
       LIVE MATCH
    ========================= */

    .match-card {
      background: white;
      border-radius: 18px;
      padding: 30px;
      box-shadow: 0 8px 30px rgba(0,0,0,.08);
    }

    .match-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .match-header h2 {
      font-size: 22px;
    }

    .status {
      background: #f59e0b;
      color: white;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }

    .status.live {
      background: #dc2626;
    }

    .teams {
      display: flex;
      justify-content: space-around;
      align-items: center;
      text-align: center;
    }

    .team {
      width: 35%;
    }

    .flag {
      font-size: 65px;
      margin-bottom: 8px;
    }

    .team h3 {
      font-size: 24px;
    }

    .score {
      font-size: 34px;
      font-weight: 800;
      margin-top: 8px;
    }

    .vs {
      font-size: 24px;
      font-weight: 800;
      color: #64748b;
    }

    .match-info {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid #e2e8f0;

      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }

    .info {
      background: #f8fafc;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
    }

    .info small {
      display: block;
      color: #64748b;
    }

    .update-box {
      margin-top: 20px;
      padding: 18px;
      border-left: 5px solid #2563eb;
      background: #eff6ff;
      border-radius: 8px;
    }

    .update-box h3 {
      color: #1d4ed8;
      margin-bottom: 5px;
    }

    .updated-time {
      text-align: right;
      margin-top: 12px;
      font-size: 12px;
      color: #94a3b8;
    }

    /* =========================
       SECTION
    ========================= */

    section {
      margin-top: 55px;
    }

    .section-heading {
      margin-bottom: 25px;
    }

    .section-heading h2 {
      font-size: 30px;
    }

    .section-heading p {
      color: #64748b;
    }

    /* =========================
       NEWS
    ========================= */

    .news-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    .news-card {
      background: white;
      padding: 24px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,.06);
      border-left: 4px solid #2563eb;
      transition: .2s;
    }

    .news-card:hover {
      transform: translateY(-4px);
    }

    .tag {
      display: inline-block;
      background: #dbeafe;
      color: #1d4ed8;
      padding: 4px 9px;
      border-radius: 5px;
      font-size: 11px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .news-card h3 {
      font-size: 20px;
      margin-bottom: 8px;
    }

    .news-card p {
      color: #64748b;
    }

    .date {
      display: block;
      margin-top: 12px;
      font-size: 12px;
      color: #94a3b8;
    }

    /* =========================
       BLOG
    ========================= */

    .blog-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
    }

    .blog-card {
      background: white;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 5px 20px rgba(0,0,0,.06);
      transition: .2s;
    }

    .blog-card:hover {
      transform: translateY(-5px);
    }

    .blog-image {
      height: 160px;
      background: linear-gradient(135deg, #e0f2fe, #dbeafe);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 65px;
    }

    .blog-content {
      padding: 20px;
    }

    .category {
      color: #2563eb;
      font-size: 11px;
      font-weight: bold;
    }

    .blog-content h3 {
      margin: 8px 0;
      font-size: 19px;
      line-height: 1.4;
    }

    .blog-content p {
      color: #64748b;
      font-size: 14px;
    }

    .read-more {
      display: inline-block;
      margin-top: 15px;
      color: #1d4ed8;
      font-weight: bold;
      text-decoration: none;
    }

    .read-more:hover {
      text-decoration: underline;
    }

    /* =========================
       FOOTER
    ========================= */

    footer {
      background: #0f172a;
      color: #cbd5e1;
      margin-top: 60px;
      padding: 40px 20px;
      text-align: center;
    }

    footer h2 {
      color: white;
      margin-bottom: 10px;
    }

    footer p {
      font-size: 14px;
    }

       MOBILE
    ========================= */
